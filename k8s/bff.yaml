apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: attachlog
  labels:
    app: bff
    app.kubernetes.io/part-of: attachlog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: attachlog/bff:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: attachlog-secret
                  key: JWT_SECRET
            - name: PLACEMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: attachlog-config
                  key: PLACEMENT_SERVICE_URL
            - name: LOGBOOK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: attachlog-config
                  key: LOGBOOK_SERVICE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: attachlog
  labels:
    app: bff
    app.kubernetes.io/part-of: attachlog
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: http
      port: 8003
      targetPort: http
